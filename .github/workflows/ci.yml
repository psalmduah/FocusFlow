name: FocusFlow CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

concurrency:
  group: focusflow-dev-${{ github.ref }}
  cancel-in-progress: true

  
jobs:

  test:
    name: Test API
    runs-on: ubuntu-24.04 #updated from ubuntu-latest to ubuntu-24.04 for better compatibility with Python 3.12
    timeout-minutes: 10

    permissions:
      contents: read
    
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaaad77386f024 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record resolved Python dependencies
        run: |
          pip freeze > resolved-requirements.txt    

      - name: Upload resolved dependency list
        uses: actions/upload-artifact@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          name: resolved-requirements-${{ github.sha }}
          path: api/resolved-requirements.txt
          retention-days: 30

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v          

  docker-build:
    name: Build and Push Docker Image

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write
      id-token: write
      
    needs:
    - test

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }} \
            -t ghcr.io/${{ github.repository_owner }}/focusflow-api:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/focusflow-api:dev \
            ./api

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/focusflow-api:${{ github.sha }}
          version: v0.76.2
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate SBOM
        run: |
          trivy image \
            --format cyclonedx \
            --output focusflow-sbom.cdx.json \
            ghcr.io/${{ github.repository_owner }}/focusflow-api:${{ github.sha }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: focusflow-sbom-${{ github.sha }}
          path: focusflow-sbom.cdx.json
          retention-days: 30

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/focusflow-api:${{ github.sha }}
          
          docker push \
            ghcr.io/${{ github.repository_owner }}/focusflow-api:dev

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532

      - name: Sign container image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/focusflow-api:${{ github.sha }}"

          echo "Signing $IMAGE"

          cosign sign --yes "$IMAGE"

      - name: Verify container signature
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/focusflow-api:${{ github.sha }}"

          cosign verify "$IMAGE" \
            --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

  deploy-dev:
    name: Deploy to DEV
    runs-on: self-hosted
    timeout-minutes: 10
    
    permissions:
      contents: read

    needs:
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/app1-gpt'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify Kubernetes connection
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Deploy CI image to DEV
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/focusflow-api:${{ github.sha }}"

          echo "Deploying: $IMAGE"

          kubectl set image \
            deployment/focusflow-api \
            api="$IMAGE" \
            -n focusflow-dev

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/focusflow-api \
            -n focusflow-dev \
            --timeout=120s

      - name: Verify deployed image
        run: |
          kubectl get deployment focusflow-api \
            -n focusflow-dev \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

      - name: Smoke test DEV
        run: |
          kubectl port-forward \
            -n focusflow-dev \
            service/focusflow-api \
            18081:8000 > /tmp/focusflow-portforward.log 2>&1 &

          PF_PID=$!

          trap 'kill $PF_PID 2>/dev/null || true' EXIT

          sleep 5

          curl --fail http://localhost:18081/health
          curl --fail http://localhost:18081/version
          curl --fail http://localhost:18081/ready 

          
      - name: Roll back failed deployment
        if: failure()
        run: |
          echo "Deployment validation failed. Rolling back..."

          kubectl rollout undo \
            deployment/focusflow-api \
            -n focusflow-dev

          kubectl rollout status \
            deployment/focusflow-api \
            -n focusflow-dev \
            --timeout=120s

          echo "Rollback completed."