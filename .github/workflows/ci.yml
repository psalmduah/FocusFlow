name: FocusFlow CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  test:
    name: Test API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v

  docker-build:
    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    needs:
    - test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
          -t ghcr.io/${{ github.repository_owner }}/focusflow-api:${{ github.sha }} \
          ./api

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/focusflow-api:${{ github.sha }}
 
  deploy-dev:
    name: Deploy to DEV
    runs-on: self-hosted

    needs:
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/app1-gpt'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes connection
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Deploy CI image to DEV
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/focusflow-api:${{ github.sha }}"

          echo "Deploying: $IMAGE"

          kubectl set image \
            deployment/focusflow-api \
            api="$IMAGE" \
            -n focusflow-dev

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/focusflow-api \
            -n focusflow-dev \
            --timeout=120s

      - name: Verify deployed image
        run: |
          kubectl get deployment focusflow-api \
            -n focusflow-dev \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

      - name: Smoke test DEV
        run: |
          kubectl port-forward \
            -n focusflow-dev \
            service/focusflow-api \
            18081:8000 > /tmp/focusflow-portforward.log 2>&1 &

          PF_PID=$!

          trap 'kill $PF_PID 2>/dev/null || true' EXIT

          sleep 5

          curl --fail http://localhost:18081/this-endpoint-does-not-exist
          curl --fail http://localhost:18081/version
          curl --fail http://localhost:18081/ready 


      - name: Roll back failed deployment
        if: failure()
        run: |
          echo "Deployment validation failed. Rolling back..."

          kubectl rollout undo \
            deployment/focusflow-api \
            -n focusflow-dev

          kubectl rollout status \
            deployment/focusflow-api \
            -n focusflow-dev \
            --timeout=120s

          echo "Rollback completed."                