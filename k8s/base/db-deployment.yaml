apiVersion: apps/v1
kind: Deployment

metadata:
  name: focusflow-db
  namespace: focusflow-dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: focusflow-db

  template:

    metadata:
      labels:
        app: focusflow-db

    spec:

      containers:

        - name: postgres
          image: postgres:16

          ports:
            - containerPort: 5432

          env:

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: focusflow-db-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: focusflow-db-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: focusflow-db-secret
                  key: POSTGRES_DB

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
