apiVersion: apps/v1
kind: Deployment

metadata:
  name: focusflow-api
  namespace: focusflow-dev

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: focusflow-api

  template:

    metadata:
      labels:
        app: focusflow-api

    spec:

      containers:

        - name: api

          image: focusflow-api:5ec359b

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:

            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: focusflow-config
                  key: APP_ENV

            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: focusflow-config
                  key: LOG_LEVEL

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: focusflow-db-secret
                  key: DATABASE_URL

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:

            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:

            httpGet:
              path: /ready
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:

            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          volumeMounts:

            - name: tmp
              mountPath: /tmp

      volumes:

        - name: tmp
          emptyDir: {}