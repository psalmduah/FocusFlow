services:

  db:
    image: postgres:16

    container_name: focusflow-db

    environment:
      POSTGRES_USER: focusflow
      POSTGRES_PASSWORD: focusflow
      POSTGRES_DB: focusflow

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U focusflow -d focusflow"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  api:

    build:
      context: ./api

    container_name: focusflow-api

    environment:
      DATABASE_URL: postgresql+psycopg://focusflow:focusflow@db:5432/focusflow

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy


volumes:

  postgres_data:
