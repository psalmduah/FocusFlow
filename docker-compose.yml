services:

  db:
    image: postgres:16

    container_name: focusflow-db

    environment:
      POSTGRES_USER: focusflow
      POSTGRES_PASSWORD: focusflow
      POSTGRES_DB: focusflow

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U focusflow -d focusflow"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - backend

  api:

    build:
      context: ./api

    container_name: focusflow-api

    environment:
      DATABASE_URL: postgresql+psycopg://focusflow:focusflow@db:5432/focusflow

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    
    mem_limit: 512m
    cpus: 0.50

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
        ]

      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

    networks:
      - backend

volumes:

  postgres_data:

networks:

  backend:
    driver: bridge